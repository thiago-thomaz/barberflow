version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barberflow_app
    restart: always
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://barberflow:barberflow_secret@postgres:5432/barberflow_db?schema=public
      - JWT_SECRET=super_secret_jwt_key_production_barberflow
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: barberflow_postgres
    restart: always
    environment:
      POSTGRES_USER: barberflow
      POSTGRES_PASSWORD: barberflow_secret
      POSTGRES_DB: barberflow_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U barberflow -d barberflow_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
